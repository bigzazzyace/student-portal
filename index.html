<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
    }

    .navbar{
      background:#0d1b2a;
      color:white;
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .navbar h1{
      font-size:24px;
    }

    .hero{
      height:90vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    .hero h2{
      font-size:50px;
      color:#0d1b2a;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
      margin-bottom:30px;
      color:#555;
    }

    .btn{
      padding:15px 35px;
      background:#0d1b2a;
      color:white;
      text-decoration:none;
      border-radius:8px;
      font-size:18px;
    }

    .btn:hover{
      background:#1b263b;
    }
  </style>
</head>

<body>

  <div class="navbar">
    <h1>Student Portal</h1>
    <a href="#" class="btn">Login</a>
  </div>

  <section class="hero">
    <h2>Welcome To Student Portal</h2>
    <p>Manage registration, results, payments and student records online.</p>

    <a href="#" class="btn">Get Started</a>
  </section>

</body>
</html>
